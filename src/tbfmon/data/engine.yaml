# =============================================================================
#  tbfmon analytics engine configuration (DESIGN.md §9)
#
#  Every threshold, weight and cost assumption the engine uses lives here so a
#  maintenance engineer can audit and change it. Values are engineering
#  starting points tuned on SIMULATED data only — review against site data.
# =============================================================================
version: 1
seed: 42                      # fixes IsolationForest / RandomForest randomness

features:
  thermal_tau_min: 25.0       # generic thermal time constant for duration-normalising temperature rise
  ir_reference_c: 40.0        # insulation resistance corrected to 40 °C (IEEE 43: halves per +10 °C)

cleaning:                     # causal suspect-value rules (see DESIGN.md §7.9)
  spike_k: 5.0                # |x − median(prev 3)| > k · robust scale  ⇒ unconfirmed jump
  phase_tolerance: 0.30       # a phase >30 % from the median phase ⇒ inconsistent
  corroborate_k: 3.0          # a jump is real at once if a related parameter moved > k · scale in the same run

baseline:
  n_runs: 5                   # baseline = median/MAD of the first N healthy runs of each segment
  min_runs: 3                 # fewer ⇒ "baseline not established"
  carry_forward_days: 180     # sparse parameters (IR, airflow, noise…): last known value stays valid this long

labels:                       # what counts as a "healthy" run for training (FailureRecord / MaintenanceRecord only)
  exclude_days_before_failure: 180   # runs this close before a recorded failure are not healthy
  exclude_days_before_corrective: 90
  exclude_days_before_abnormal_pm: 60  # … nor runs shortly before a PM that found something
  abnormal_findings: ["low", "loose", "clogged", "dry", "discoloured", "metallic", "rumble", "cracked",
                      "unbalance", "deposit", "below torque", "worn", "wear"]

drift:
  ewma_lambda: 0.3
  ewma_limit: 2.5             # flag when |EWMA of z| > limit · sqrt(λ/(2−λ))
  cusum_k: 0.5                # CUSUM slack (in z units)
  cusum_h: 5.0                # CUSUM decision interval
  z_watch: 3.0                # |robust z| considered a notable deviation
  z_cap: 8.0                  # z-scores are clipped to ±cap for scoring

peers:
  window_days: 365            # peers' values from the trailing year (causal)
  min_peers: 3

anomaly:
  n_estimators: 200
  flag_percentile: 0.98       # anomalous when more extreme than 98 % of healthy training runs
  top_k: 3

supervised:
  lookback_days: 180          # runs within this window before a failure are labelled with its mode
  ambiguous_days: 365         # runs 180–365 days before a failure are excluded from training
  n_splits: 5                 # GroupKFold by fan
  n_estimators: 300
  max_depth: 6
  min_samples_leaf: 3

fault_modes:
  top_k: 3
  rule_weight: 0.6            # combined = rule_weight · rule confidence + (1 − rule_weight) · model probability
  min_confidence: 0.5         # below this a mode is not named in recommendations

trend:
  min_runs: 4
  min_span_days: 60
  max_runs: 10                # use the last N runs of the current segment
  confidence: 0.90            # confidence level of the Theil–Sen slope interval

health_index:                 # HI = 100 − Σ weight · component (each component ∈ [0, 1])
  weights:
    limits: 30                # OK 0 · WARN 0.5 · ALARM 1
    drift: 20                 # worst bad-direction z / 6, +0.25 if EWMA/CUSUM flagged
    anomaly: 15               # (percentile − 0.5) / 0.5
    fault_mode: 15            # top combined fault-mode confidence
    trend: 15                 # time-to-ALARM: <90 d → 1, <180 d → 0.6, <365 d → 0.3
    peers: 5                  # worst bad-direction peer z / 6
  status:                     # lower bounds; below "degraded" ⇒ Critical
    healthy: 80
    watch: 60
    degraded: 40
  alarm_is_critical: true     # any limit ALARM forces Critical
  warn_is_watch: true         # any limit WARN caps status at Watch

recommender:
  horizon_days: 365           # savings compared over the next year
  urgent_within_days: 7
  inspect_within_days: 30
  watch_inspect_within_days: 60
  stale_after_days: 120       # no run for this long ⇒ condition unknown ⇒ follow OEM
  defer_factor: 1.0           # a deferrable task is postponed by this × its interval …
  max_interval_factor: 2.0    # … but never beyond this × its interval since last done
  # OEM tasks that may be deferred when condition is healthy (case-insensitive substring match).
  # Not deferrable: insulation resistance test and control/starter checks — cheap, no height,
  # and they are themselves condition measurements.
  deferrable_tasks: ["inspection and cleaning", "regreasing", "torque", "balance", "terminal box",
                     "bearing replacement"]
  # Man-hours per task occurrence (crew-hours incl. platform/scaffold set-up when at height).
  man_hours:
    at_height: 10.0
    ground: 2.0
    targeted_inspection: 8.0
    urgent_corrective: 16.0
  # Evidence required to defer, per task keyword: fault modes whose confidence must be low.
  task_modes:
    regreasing: [lubrication_loss, bearing_wear]
    bearing replacement: [bearing_wear, lubrication_loss]
    inspection and cleaning: [airflow_restriction, impeller_imbalance]
    torque: [misalignment_looseness]
    balance: [impeller_imbalance]
    terminal box: [insulation_degradation]
  # What a targeted inspection covers for each suspected mode.
  inspections:
    bearing_wear: ["Vibration spectrum + envelope analysis at {loc} bearing", "Listen/feel bearing on hand rotation", "Check grease condition"]
    lubrication_loss: ["Regrease {loc} bearing", "Check bearing temperature on a 30-min run"]
    impeller_imbalance: ["Inspect and clean impeller blades", "Trim-balance in situ if 1x remains high"]
    misalignment_looseness: ["Check mounting bolt torque", "Inspect AV mounts", "Check alignment"]
    insulation_degradation: ["Repeat IR/PI test at motor terminals", "Check terminal box for moisture", "Consider anti-condensation heater / drying"]
    airflow_restriction: ["Inspect and clean silencer and guards", "Check damper operation"]
  corrective:
    bearing_wear: ["Replace {loc} bearing"]
    lubrication_loss: ["Replace/regrease {loc} bearing"]
    impeller_imbalance: ["Clean and dynamically balance impeller"]
    misalignment_looseness: ["Replace AV mounts, re-torque and realign"]
    insulation_degradation: ["Dry out or rewind motor"]
    airflow_restriction: ["Clear silencer/guards, repair damper"]

evaluation:
  # OEM tasks able to catch each mode (for the OEM time-based baseline).
  oem_catches:
    bearing_wear: ["regreasing", "bearing replacement"]
    lubrication_loss: ["regreasing", "bearing replacement"]
    impeller_imbalance: ["cleaning", "balance"]
    misalignment_looseness: ["torque"]
    insulation_degradation: ["insulation resistance"]
    airflow_restriction: ["cleaning"]
  pre_onset_grace_days: 30    # alerts this close before a fault onset are not false alarms
